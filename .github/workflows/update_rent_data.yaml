name: Update Rent Tracker Data

permissions:
  contents: write
  actions: read

on:
  schedule:
    - cron: '0 12 * * *'  # Run daily at 12:00 UTC to check if we should run
  workflow_dispatch:  # Allow manual trigger

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install python-dateutil
        
    - name: Determine which scripts to run
      id: determine_scripts
      run: |
        python << 'EOF'
        from datetime import datetime, timedelta
        import os
        
        def get_nth_working_day(year, month, n):
            """Get the nth working day of a given month"""
            current = datetime(year, month, 1)
            working_days = 0
            
            while working_days < n:
                if current.weekday() < 5:  # Monday through Friday
                    working_days += 1
                    if working_days == n:
                        return current.day
                current += timedelta(days=1)
            
            return None
        
        today = datetime.now()
        current_day = today.day
        
        # Calculate 12th working day of current month
        twelfth_working_day = get_nth_working_day(today.year, today.month, 12)
        
        print(f"Today is: {today.strftime('%Y-%m-%d')} (day {current_day})")
        print(f"12th working day of this month: day {twelfth_working_day}")
        print(f"16th calendar day: day 16")
        
        # Determine which is later
        later_day = max(twelfth_working_day, 16)
        print(f"Later day: {later_day}")
        
        # Determine what to run
        run_homebuilding = "false"
        run_zillow = "false"
        
        if current_day == twelfth_working_day and current_day < 16:
            print("Action: Run homebuilding only (12th working day, before 16th)")
            run_homebuilding = "true"
        elif current_day == later_day:
            print("Action: Run full pipeline (later of 12th working day or 16th)")
            run_homebuilding = "true"
            run_zillow = "true"
        else:
            print("Action: Skip (not a scheduled day)")
        
        # Write to GitHub output
        with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
            f.write(f"run_homebuilding={run_homebuilding}\n")
            f.write(f"run_zillow={run_zillow}\n")
            f.write(f"twelfth_working_day={twelfth_working_day}\n")
            f.write(f"later_day={later_day}\n")
        EOF
    
    - name: Check if we should proceed
      id: should_run
      run: |
        if [ "${{ steps.determine_scripts.outputs.run_homebuilding }}" == "false" ]; then
          echo "Not a scheduled day - skipping all data collection"
          echo "skip=true" >> $GITHUB_OUTPUT
        else
          echo "Scheduled day detected - proceeding with data collection"
          echo "skip=false" >> $GITHUB_OUTPUT
        fi
        
    - name: Run homebuilding collection
      if: steps.should_run.outputs.skip == 'false'
      working-directory: rent_tracker
      run: python scripts/01_collect_homebuilding.py
      
    - name: Run population collection
      if: steps.determine_scripts.outputs.run_zillow == 'true'
      working-directory: rent_tracker
      run: python scripts/02_collect_population.py
      
    - name: Run Zillow county collection
      if: steps.determine_scripts.outputs.run_zillow == 'true'
      working-directory: rent_tracker
      run: python scripts/03_collect_zillow_county.py
      
    - name: Run Zillow metro collection
      if: steps.determine_scripts.outputs.run_zillow == 'true'
      working-directory: rent_tracker
      run: python scripts/04_collect_zillow_metro.py
      
    - name: Run merge and finalize
      if: steps.determine_scripts.outputs.run_zillow == 'true'
      working-directory: rent_tracker
      run: python scripts/05_merge_and_finalize.py

    - name: Commit and push if changes
      if: steps.should_run.outputs.skip == 'false'
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add rent_tracker/data/
        
        # Only commit if there are changes
        if git diff --staged --quiet; then
          echo "No changes to commit"
          exit 0
        else
          git commit -m "Update rent tracker data - $(date +'%Y-%m-%d')"
          git push
        fi